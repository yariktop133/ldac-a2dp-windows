name: build

on:
  push:
  pull_request:

jobs:
  core:
    name: Protocol core, codecs, service, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (build.cmd)
        shell: cmd
        run: build.cmd

  utility:
    name: Settings utility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ui/LdacConfig -c Release

  driver:
    name: KMDF driver
    runs-on: windows-latest
    # Needs a WDK with ACX 1.1 on the runner image; not guaranteed, so it may not block the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (build_driver.cmd Release)
        shell: cmd
        run: build_driver.cmd Release -p:SignMode=Off
